<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Army</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      color-scheme: dark;
      font: 12px consolas;
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
    }


    .enlisted {
      display: grid;
      gap: 0.5rem;
      grid-template-columns: auto 10em 1fr;
      /* margin: 0.5em 2em; */
      border: 1px solid #ccc;
      i {
        display: block;
        height:1lh; width: 1lh;
        background-color: #f008;
      }
      &.e00 i {background-color: oklch(35% 50% 070); background-image: url('svg/e00.svg');}
      &.e01 i {background-color: oklch(35% 50% 080); background-image: url('svg/e01.svg');}
      &.e02 i {background-color: oklch(35% 50% 090); background-image: url('svg/e02.svg');}
      &.e03 i {background-color: oklch(35% 50% 100); background-image: url('svg/e03.svg');}
      &.e04 i {background-color: oklch(35% 50% 110); background-image: url('svg/e04.svg');}
      &.e05 i {background-color: oklch(35% 50% 120); background-image: url('svg/e05.svg');}
      &.e06 i {background-color: oklch(35% 50% 130); background-image: url('svg/e06.svg');}
      &.e07 i {background-color: oklch(35% 50% 140); background-image: url('svg/e07.svg');}
      &.e08 i {background-color: oklch(35% 50% 150); background-image: url('svg/e08.svg');}
      &.e09 i {background-color: oklch(35% 50% 160); background-image: url('svg/e09.svg');}
      &.e10 i {background-color: oklch(35% 50% 170); background-image: url('svg/e10.svg');}
      &.e11 i {background-color: oklch(35% 50% 180); background-image: url('svg/e11.svg');}
      &.e12 i {background-color: oklch(35% 50% 190); background-image: url('svg/e12.svg');}
      &.e13 i {background-color: oklch(35% 50% 200); background-image: url('svg/e13.svg');}
      ul {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        grid-column: 2;
        grid-row: 2;
        li {
          text-align: center;
        }
      }
    }

    .officer {
      display: grid;
      gap: 0.5rem;
      grid-template-columns: auto 12em 1fr;
      /* margin: 0.5em 2em; */
      border: 1px solid #ccc;
      i {
        display: block;
        height:1lh; width: 1lh;
        background-color: #08f8;
        outline: 1px solid;
      }
      &.o00 i {background-color: oklch(35% 50% 290); background-image: url('svg/o00.svg');}
      &.o01 i {background-color: oklch(35% 50% 260); background-image: url('svg/o01.svg');}
      &.o02 i {background-color: oklch(35% 50% 230); background-image: url('svg/o02.svg');}
      &.o03 i {background-color: oklch(35% 50% 230); background-image: url('svg/o03.svg');}
      &.o04 i {background-color: oklch(35% 50% 230); background-image: url('svg/o04.svg');}
      &.o05 i {background-color: oklch(35% 50% 200); background-image: url('svg/o05.svg');}
      &.o06 i {background-color: oklch(35% 50% 170); background-image: url('svg/o06.svg');}
      &.o07 i {background-color: oklch(35% 50% 170); background-image: url('svg/o07.svg');}
      &.o08 i {background-color: oklch(35% 50% 170); background-image: url('svg/o08.svg');}
      &.o09 i {background-color: oklch(35% 50% 140); background-image: url('svg/o09.svg');}
      &.o10 i {background-color: oklch(35% 50% 110); background-image: url('svg/o10.svg');}
      &.o11 i {background-color: oklch(35% 50% 110); background-image: url('svg/o11.svg');}
      &.o12 i {background-color: oklch(35% 50% 110); background-image: url('svg/o12.svg');}
      &.o13 i {background-color: oklch(35% 50% 050); background-image: url('svg/o13.svg');}
      ul {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        grid-column: 2;
        grid-row: 2;
        li {
          text-align: center;
        }
      }
    }

    .formation {
      --color: #888;
      --gap: 0.25rem;
      display: inline-block;
      &>i {
        display: block;
        border: 1px solid;
        height: 2rlh;
        width: 3rlh;
        margin-block: 1rem;
        &::before {
          content: '•';
          content: attr(size);
          position: absolute;
          left: 0rem; right: 0rem; width: auto;
          top: auto; bottom: 100%; height: auto;
          text-align: center;
        }
        &::after {
          content: '';
          position: absolute;
          left: -1px; right: auto; width: auto;
          top: 100%; bottom: auto; height: calc(2rem + var(--gap));
          border-left: 1px solid var(--color);
        }
      }
    }
    .formation,.formation>ul>li {
      /* padding: 1rem; */
      &>ul {
        display: grid;
        row-gap: var(--gap);
        padding-left: 1rem;
        &>li {
          &::before {
            content: '';
            position: absolute;
            left: auto; right: 100%; width: 1rem;
            top: 1rlh; bottom: 0rem; height: auto;
            border-top: 1px solid var(--color);
          }
          &:not(:last-child)::after {
            content: '';
            position: absolute;
            left: auto; right: 100%; width: 1rem;
            top: 1rlh; bottom: auto; height: calc(100% + var(--gap));
            border-left: 1px solid var(--color);
          }
        }
      }
      &.sqd>ul>li {
        padding-bottom: 1rem;
      }
    }

    .plt>ul {
      --color: #888;
      display: inline grid;
      grid-auto-flow: column;
      margin: 0.5rlh;
      li:has([size="•"]) {
        padding-inline: 0.5rlh;
        &:not(:first-child)::before {
          content: '';
          position: absolute;
          left: 0rem; right: auto; width: calc(2rlh + 1px);
          top: auto; bottom: 100%; height: 1rem;
          border-top: 1px solid var(--color);
          border-right: 1px solid var(--color);
        }
        &:not(:last-child)::after {
          content: '';
          position: absolute;
          left: 2rlh; right: 0rem; width: auto;
          top: auto; bottom: 100%; height: 1rem;
          border-top: 1px solid var(--color);
          border-left: 1px solid var(--color);
        }
      }
    }
</style>

              'Master Corporal',
              'Lance  Sergeant',

              'Master Sergeant',
              'Lance Sergeant Major',
              'Company Sergeant Major',
              'Battalion Sergeant Major',
              'Regiment Sergeant Major',
              'Master Sergeant Major',

            }"></i>

          <ul class=kit>
