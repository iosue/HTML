<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    :root {
      color-scheme: dark;
    }
    canvas {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <resources style="display:none">
    <img id="mapImg" src="./me.png">
  </resources>
  <script type="module">
    import gameDefs from "./gameDefs.json" with {type:'json'}
    import Hex from "./hex.js"
    import {C,M,zoomToC} from "./camera.js"
    import {CVS,CTX,initCanvi,generateGrid,resetCanvi} from "./canvas.js"
    import {mapData,generateMap,drawMap,drawGrid} from "./map.js"
    import "./listeners.js"

    onload=()=>{
      initCanvi(gameDefs.layers)
      resetCanvi(gameDefs.layers)
      generateMap()
      generateGrid()
      refresh()
      let h1=new Hex(0,0),
          h2=new Hex(0,1)

      console.log(...h1.nAddresses)
      console.log(...h2.nAddresses)
    }

    function refresh() {
      resetCanvi(gameDefs.layers)
      zoomToC(gameDefs.layers)
      drawMap()
      // drawGrid()

      for (const hex of mapData) {
        // console.log(hex)
        CTX['map'].save()
        CTX['map'].translate(hex.x,hex.y)
        if (CTX['map'].isPointInPath(hex.path,M.x,M.y)) {
          hex.highlight(CTX['map'])
        }
        CTX['map'].restore()
      }

      requestAnimationFrame(refresh)
    }

  </script>
</body>
</html>
