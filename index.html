<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    :root {
      color-scheme: dark;
    }
    canvas {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <resources style="display:none">
    <img id="mapImg" src="./me.png">
  </resources>
  <script type="module">
    import gameDefs from "./gameDefs.json" with {type:'json'}
    import Hex from "./hex.js"
    import {C,M,lockCamera,zoomToC} from "./camera.js"
    import {CVS,CTX,initCanvi,resetCanvi} from "./canvas.js"
    import {mapData,generateMap,generateGrid,drawMap,drawGrid} from "./map.js"
    import "./listeners.js"

    Array.prototype.jiggleSort=function(param,jiggle=1) {
      return this.sort((a,b)=>a[param]-b[param]+(Math.random()-1/2)*jiggle)
    }

    const Walk={
      dist:{},
      pend:{},
      prev:{},
    }


    onload=()=>{
      initCanvi(gameDefs.layers)
      resetCanvi(gameDefs.layers)
      generateMap()

      let startHex=mapData.find(h=>h.i==10&&h.j==12)
      for (const hex of mapData) {
        Walk.dist[hex]=Infinity
        Walk.dist[startHex]=0
      }

      refresh()
    }

    function refresh() {
      resetCanvi(gameDefs.layers)
      lockCamera()
      zoomToC(gameDefs.layers)
      drawMap()
      // drawGrid()

      for (const hex of mapData) {
        CTX['map'].save()
        if (CTX['map'].isPointInPath(hex.path,M.x-hex.x/C.z,M.y-hex.y/C.z)) {
          // hex.nList(mapData,1).forEach(n=>n?.highlight(CTX['map'],'goldenrod'))
          // hex.highlight(CTX['map'])
          hex.ident(CTX['map'])
        }
        CTX['map'].restore()
      }

      // takeStep()

      requestAnimationFrame(refresh)
    }

  </script>
</body>
</html>
