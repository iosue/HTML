<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    :root {
      color-scheme: dark;
    }
    canvas {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <script type="module">
    import gameDefs from "./gameDefs.json" with {type:'json'}
    import {C,M,zoomToC} from "./camera.js"
    import {CVS,CTX,initCanvi,generateMap,generateGrid,resetCanvi} from "./canvas.js"
    import "./listeners.js"


    onload=()=>{
      initCanvi(gameDefs.layers)
      generateMap()
      generateGrid()
  
      refresh()
    }

    function refresh() {
      resetCanvi(gameDefs.layers)
      zoomToC(gameDefs.layers)

      CTX['map'].drawImage(CVS['bmp'],0,0)
      CTX['map'].drawImage(CVS['grid'],0,0)

      requestAnimationFrame(refresh)
    }

  </script>
</body>
</html>
