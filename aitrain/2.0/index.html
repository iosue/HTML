			let last = performance.now()
			function loop(now = performance.now()) {
				const dt = (now - last) / 1000
				last = now
				cvs.width = innerWidth
				cvs.height = innerHeight
				ctx.translate(innerWidth/2,innerHeight/2)

				let scale=100

				scale = 1.75/2
				ctx.scale(scale,scale)
				ctx.globalAlpha = 0.75

				ctx.translate(-500,-200)

				network.draw(ctx)
				document.title = now
				if (!pause) requestAnimationFrame(loop)
			}

			onload=()=>loop()

			cvs.addEventListener("click", e => {
				if (network.hoveredEngineId) {
					network.activeEngineId = network.hoveredEngineId
				} else if (network.hoveredSwitchId) {
					let sw = network.switches.get(network.hoveredSwitchId)
					let point = sw.points[sw.currentIndex]
					point.switch(sw,network)
				}
			})

			cvs.addEventListener("mousemove", e => {
				for (const [id,sw] of network.switches) {
					ctx.save()
					const m = ctx.getTransform().inverse().transformPoint(new DOMPoint(e.x, e.y));
					ctx.restore()
					let point = sw.points[sw.currentIndex]
					const dist = Math.hypot(point.x - m.x, point.y - m.y)
					const local = point.toLocal(m.x, m.y)
					if (dist < settings.clickRadius*(network.hoveredSwitchId?3/2:1) && local.x*{A:1,B:-1}[point.end] > 0) {
						network.hoveredSwitchId = id
						break
					} else if (network.hoveredSwitchId==id) {
						network.hoveredSwitchId = null
					}
				}
				for (const [id,train] of network.trains) {
					ctx.save()
					const m = ctx.getTransform().inverse().transformPoint(new DOMPoint(e.x, e.y));
					ctx.restore()
					const traction = train.engine.A
					const local = traction.toLocal(m.x, m.y)
					const dx = traction.x - m.x,
								dy = traction.y - m.y
					if (Math.abs(dy)<settings.clickRadius && -10<dx && dx<70) {
						network.hoveredEngineId = train.engine.id
						break
					} else if (network.hoveredEngineId==train.engine.id) {
						network.hoveredEngineId = null
					}
				}
				cvs.style.cursor = (network.hoveredSwitchId || network.hoveredEngineId) ? "pointer" : "default"
			})

			window.addEventListener("keydown", e => {
				const engine=network.engines.get(network.activeEngineId)
				switch (e.code) {
					case "KeyW":
					case "ArrowUp":
						engine.targetSpeed = engine.maxSpeed*(engine.gearForward?1:-1)
						break
					case "KeyS":
					case "ArrowDown":
						engine.targetSpeed = 0
						engine.activeBraking = true
						break
					case "Tab":
						e.preventDefault()
						if (engine.speed == 0) {
							engine.gearForward=!engine.gearForward
							console.log('change direction:',engine.gearForward?"forward":"reverse")
						} else {
							console.warn('train in motion, cannot change gear')
						}
						break
					case "ShiftLeft":
						// optional: coast when released
						engine.speedLock ??= false
						engine.speedLock = !engine.speedLock
						if (engine.speedLock) engine.targetSpeed = engine.speed
						else engine.targetSpeed = 0
						break
				}
			})
			window.addEventListener("keyup", e => {
				const engine=network.engines.get(network.activeEngineId)
				if (e.code === "KeyW" || e.code === "ArrowUp") {
					// optional: coast when released
					if (!engine.speedLock) engine.targetSpeed = 0
				}
				if (e.code === "KeyS" || e.code === "ArrowDown") {	
					// optional: coast when released
					engine.activeBraking = false
				}
			})

			window.addEventListener("keyup", e => {
				if (e.code === "Escape") {
					pause=!pause
					loop()
				}
			})
