			let last = performance.now()
			function loop(now = performance.now()) {
				const dt = (now - last) / 1000
				last = now
				cvs.width = innerWidth
				cvs.height = innerHeight
				ctx.translate(innerWidth/2,innerHeight/2)

				let scale=100

				scale = 0.75
				ctx.scale(scale,scale)
				ctx.globalAlpha = 0.8

				ctx.translate(-50,0)

				network.draw(ctx)
				document.title = now
				if (!pause) requestAnimationFrame(loop)
			}

			onload=()=>loop()

			cvs.addEventListener("click", e => {
				if (network.hoveredPoint) {
					const point=network.hoveredPoint[0]
					point.switch(network.hoveredPoint[1],network)
				}
			})

			cvs.addEventListener("mousemove", e => {
				for (const point of network.points.values()) {
					if (point) {
						ctx.save()
						const m = ctx.getTransform().inverse().transformPoint(new DOMPoint(e.x, e.y));
						ctx.restore()
						const dist = Math.hypot(point.x - m.x, point.y - m.y)
						if (dist < settings.clickRadius*(network.hoveredPoint?2:1)) {
							const local = point.toLocal(m.x, m.y)
							if (local.x < 0 && point.in.size>1) {
								return network.hoveredPoint = [point,'in']
								break
							}
							if (local.x > 0 && point.out.size>1) {
								return network.hoveredPoint = [point,'out']
								break
							}
						}
					}
				}
				cvs.style.cursor = network.hoveredPoint ? "pointer" : "default"
				network.hoveredPoint = null
			})
