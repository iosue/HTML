<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Document</title>
		<style>
			:root {
				color-scheme: dark;
			}
			canvas {
				position: fixed;
				inset: 0;
			}
		</style>
	</head>
	<body>
		<script type="module">
			import {
				TrackSection,
				CurvedTrackSection,
				SwitchSection,
			} from "./classes/tracks.js"
			import { Train } from "./classes/trains.js"
			import { TrackNetwork } from "./classes/network.js"

			const Camera = { x: 0, y: 0, z: 1, v: 10 / 9 }

			const cvs = document.createElement("canvas")
			cvs.id = "yard"
			cvs.width = innerWidth
			cvs.height = innerHeight
			document.body.appendChild(cvs)
			const ctx = cvs.getContext("2d")

			const network = new TrackNetwork()

			network.addSection(new TrackSection("A", 50, 200, 0, 150, network))
			network.addSection(new SwitchSection("S", 0, 0, 0, 50, network))
			network.addSection(new CurvedTrackSection("B", 0, 0, 0, 100, Math.PI/4, network))
			network.addSection(new CurvedTrackSection("C", 0, 0, 0, 100, -Math.PI/4, network))
			network.addSection(new CurvedTrackSection("D", 0, 0, 0, 50, Math.PI/2, network))

			network.connectSections(network.get("A"), network.get("S"))
			network.connectSections(network.get("S"), network.get("B"))
			network.connectSections(network.get("S"), network.get("C"))
			network.connectSections(network.get("C"), network.get("D"))
			network.get("S").setRoute(1)

			// Train
			const train=network.addTrain(new Train("T1", network.get("A"), 100, network))

			// Animation loop
			let last = performance.now()
			function loop(now = performance.now()) {
				const dt = (now - last) / 1000
				last = now

				cvs.width = innerWidth
				cvs.height = innerHeight
				network.update(dt)
				network.draw(ctx)

				document.title = now
				requestAnimationFrame(loop)
			}
			loop()

			cvs.addEventListener("click", e => {
				const rect = cvs.getBoundingClientRect()
				const x = e.clientX - rect.left
				const y = e.clientY - rect.top

				// Find clicked switch
				for (const section of network.sections.values()) {
					if (section instanceof SwitchSection) {
						const dx = x - section.end.x
						const dy = y - section.end.y
						const dist = Math.hypot(dx, dy)

						if (dist < 15) {
							// click radius around switch end
							section.cycleRoute()
							break
						}
					}
				}
			})
			cvs.addEventListener("mousemove", e => {
				const rect = cvs.getBoundingClientRect()
				const x = e.clientX - rect.left
				const y = e.clientY - rect.top
				let hoveringSwitch = false
				for (const section of network.sections.values()) {
					if (section instanceof SwitchSection) {
						const dx = x - section.end.x
						const dy = y - section.end.y
						const dist = Math.hypot(dx, dy)
						if (dist < 15) {
							// same radius as click
							hoveringSwitch = true
							section.isHovered = true
							break
						} else {
							section.isHovered = false
						}
					}
				}
				cvs.style.cursor = hoveringSwitch ? "pointer" : "default"
			})

			window.addEventListener("keydown", e => {
				switch (e.code) {
					case "KeyW":
					case "ArrowUp":
						train.targetSpeed = train.maxSpeed
						break
					case "KeyS":
					case "ArrowDown":
						train.targetSpeed = 0
						break
					case "Tab":
						e.preventDefault()
						train.setGearForward(!train.forward)
						break
				}
			})

			window.addEventListener("keyup", e => {
				if (e.code === "KeyW" || e.code === "ArrowUp" || e.code === "KeyS" || e.code === "ArrowDown") {
					// optional: coast when released
					train.targetSpeed = train.speed
				}
			})
		</script>
	</body>
</html>
