<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    :root {
      color-scheme: dark;
    }
    canvas {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <script type="module">
import {TrackNetwork,TrackSection,CurvedTrackSection,SwitchSection,Train} from "./classes.js"

const Camera={x:0,y:0,z:1,v:10/9}

const cvs = document.createElement("canvas");
    cvs.id="yard";
    cvs.width=innerWidth;
    cvs.height=innerHeight;
  document.body.appendChild(cvs);
const ctx = cvs.getContext("2d");

const network = new TrackNetwork();

// Build a tiny demo layout
const A = network.addSection(new TrackSection("A", 25, 200, 0, 150));
const S = network.addSection(new SwitchSection("S", 0, 0, 0, 50)); // placeholder
network.connectSections(A, S);

const B = network.addSection(new TrackSection("B", 0, 0, 0, 100));
const C = network.addSection(new CurvedTrackSection("C", 0, 0, 0, 100, Math.PI / 4));

network.connectSections(S, B); // adds B
network.connectSections(S, C); // keeps both (distinct geometry)
// network.disconnectSections(S, B); // B fades out smoothly
// network.connectSections(C, B); // replaces C’s old connection



// Train
network.addTrain(new Train("T1", A, 60));

// Animation loop
let last = performance.now();
function loop(now=performance.now()) {
    const dt = (now - last) / 1000;
    last = now;

    cvs.width=innerWidth;
    cvs.height=innerHeight;
    network.update(dt);
    network.draw(ctx);

    document.title=now
    requestAnimationFrame(loop);
}
loop();

  </script>
</body>
</html>
