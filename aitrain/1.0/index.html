<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Document</title>
		<style>
			:root {
				color-scheme: dark;
			}
			canvas {
				position: fixed;
				inset: 0;
			}
		</style>
	</head>
	<body>
		<script type="module">
			import {
				TrackSection,
				CurvedTrackSection,
				SwitchSection,
				NewStraight,
				NewCurve,
			} from "./classes/tracks.js"
			import { Train } from "./classes/trains.js"
			import { TrackNetwork } from "./classes/network.js"

			const Camera = { x: 0, y: 0, z: 1, v: 10 / 9 }
			const A="A", B="B"

			const cvs = document.createElement("canvas")
					cvs.id = "yard"
					cvs.width = innerWidth
					cvs.height = innerHeight
				document.body.appendChild(cvs)
			const ctx = cvs.getContext("2d")

			const network = new TrackNetwork()

			network.addSection(new NewStraight(network,'NS1',0,0,0*Math.PI/180,100,'salmon'))
			network.addSection(new NewCurve(   network,'NC1',0,0,0*Math.PI/180,100,30*Math.PI/180))
			network.addSection(new NewCurve(
				network,'NC2', 0, 0, 0,
				100, 30*Math.PI/180, 0, 'green')
			)
			network.newConnectSections('NS1','B','NC1','A')
			network.newConnectSections('NC1','B','NC2','A')

// 			const A=network.addSection(new TrackSection("A", 50, 200, 15*Math.PI/180, 140, network,'green'))
// 			// const S=network.addSection(new SwitchSection("S", 0, 0, 0, 10, network))
// 			const B=network.addSection(new CurvedTrackSection("B", 0, 0, 0, 100, Math.PI/4, network))
// 			// const C=network.addSection(new CurvedTrackSection("C", 0, 0, 0, 100, -Math.PI/4, network))
// 			// network.addSection(new CurvedTrackSection("D", 0, 0, 0, 41.4, Math.PI*3/2, network))

// network.connectSections(A, "end", B, "end")
// // network.connectSections(S, S.end, B, B.start)
// // network.connectSections(S, S.end, C, C.end)
// // network.connectSections(switch1, switch1.end, curve1, curve1.start)


// 			// Train
// 			network.addTrain(new Train("T1", network.getTrack("A"), 100, network))

			// Animation loop
			let last = performance.now()
			function loop(now = performance.now()) {
				const dt = (now - last) / 1000
				last = now

				cvs.width = innerWidth
				cvs.height = innerHeight

				ctx.translate(innerWidth/2,innerHeight/2)

				network.update(dt)
				network.draw(ctx)

				document.title = now
				requestAnimationFrame(loop)
			}
			loop()

			cvs.addEventListener("click", e => {
				const rect = cvs.getBoundingClientRect()
				const x = e.clientX - rect.left
				const y = e.clientY - rect.top

				// Find clicked switch
				for (const section of network.sections.values()) {
					if (section instanceof SwitchSection) {
						const dx = x - section.end.x
						const dy = y - section.end.y
						const dist = Math.hypot(dx, dy)

						if (dist < 15) {
							// click radius around switch end
							section.cycleRoute()
							break
						}
					}
				}
			})
			cvs.addEventListener("mousemove", e => {
				const rect = cvs.getBoundingClientRect()
				const x = e.clientX - rect.left
				const y = e.clientY - rect.top
				let hoveringSwitch = false
				for (const section of network.sections.values()) {
					if (section instanceof SwitchSection) {
						const dx = x - section.end.x
						const dy = y - section.end.y
						const dist = Math.hypot(dx, dy)
						if (dist < 15) {
							// same radius as click
							hoveringSwitch = true
							section.isHovered = true
							break
						} else {
							section.isHovered = false
						}
					}
				}
				cvs.style.cursor = hoveringSwitch ? "pointer" : "default"
			})

			window.addEventListener("keydown", e => {
				const train=network.getTrain("T1")
				switch (e.code) {
					case "KeyW":
					case "ArrowUp":
						train.targetSpeed = train.maxSpeed
						break
					case "KeyS":
					case "ArrowDown":
					case "Space":
						train.targetSpeed = 0
						train.activeBraking = true
						break
					case "Tab":
						e.preventDefault()
						train.setGearForward(!train.forward, train.speed)
						break
				}
			})

			window.addEventListener("keyup", e => {
				const train=network.getTrain("T1")
				if (e.code === "KeyW" || e.code === "ArrowUp" || e.code === "KeyS" || e.code === "ArrowDown") {
					// optional: coast when released
					train.targetSpeed = train.speed
				}
				if (e.code === "KeyS" || e.code === "ArrowDown" || e.code === "Space") {
					// optional: coast when released
					train.activeBraking = false
				}
			})
		</script>
	</body>
</html>
