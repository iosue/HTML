<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SandFall</title>
  <style>
    :root {
      color-scheme: dark;
    }
    canvas {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <script>
    const CVS={}, CTX={}, layers=['map'], Game={grains:[]}, M={b:[]}
    for (const layer of layers) {
      CVS[layer]=document.createElement('canvas')
      document.body.appendChild(CVS[layer])
      CVS[layer].id=layer
      CTX[layer]=CVS[layer].getContext('2d')
    }

    onload=refresh()
    addEventListener('mousemove',e=>{
      M.x=e.x
      M.y=e.y
    })
    addEventListener('mousedown',e=>{
      M.b[e.button]=true
    })
    addEventListener('mouseup',e=>{
      delete M.b[e.button]
    })

    function refresh() {
      for (const layer of layers) {
        CVS[layer].width=innerWidth
        CVS[layer].height=innerHeight
      }

      if (M.b[0] && 0<M.x && M.x<innerWidth && 0<M.y && M.y<innerHeight && Game.grains.length<50) {
        console.log('click')
        Game.grains.push(new Grain(M.x,M.y))
      }

      // let toUpdate=[]
      // Game.grains.forEach(grain=>toUpdate.push(grain))
      // toUpdate.forEach(grain=>grain.update())

      Game.grains.forEach(grain=>grain.fall())
      Game.grains.forEach(grain=>grain.bump())
      Game.grains.forEach(grain=>grain.draw())

      requestAnimationFrame(refresh)
    }

    Math.toZero=function(n) {
      if (n>0) return Math.max(0,n)
      if (n<0) return Math.min(0,n)
      return 0
    }

    class Grain {
      constructor(x,y,grounded=false) {
        let R=Math.random()*6,
            A=Math.random()*Math.PI*2
        this.G = .005
        this.x = x ?? Math.random()*innerWidth/2
        this.y = y ?? Math.random()*innerHeight/2
        this.u = R*Math.cos(A)
        this.v = R*Math.sin(A)
        this.a = 0
        this.b = 0
        this.f = 0
        this.g = this.G
        this.grounded = grounded
        this.fixed = {}

        this.w = 50
        this.h = 50
        this.hue = Game.grains.length
        console.log(this.hue)
      }
      get F() {
        return this.grounded?Math.abs(this.u)>0?-Math.sign(this.u)*0.1:-this.u:0
      }
      update() {
        this.fall()
        this.bump()
        this.draw()
      }
      fall() {

        this.next={}
        this.last={}

        this.next.x = this.x+this.u
        this.next.u = this.u+this.a
        this.next.a = this.a+this.f
        this.next.f = 0
        if (this.grounded) this.next.u -= this.u/10
 
        this.next.y = this.y+this.v
        this.next.v = this.v+this.b
        this.next.b = this.b+this.g
        this.next.g = this.G

        if (this.next.x<this.w/2) {
          this.next.x = this.w/2
          this.next.u = 0
          this.next.a = 0
          this.fixed.x = true
        }

        if (this.next.x>innerWidth-this.w/2) {
          this.next.x = innerWidth-this.w/2
          this.next.u = 0
          this.next.a = 0
          this.fixed.x = true
        }

        if (this.next.y>innerHeight-this.h/2) {
          this.next.y = innerHeight-this.h/2
          this.next.v = 0
          this.next.b = 0
          this.next.grounded=true
        }

        if (this.next.y<this.h/2) {
          this.next.y = this.h/2
          this.next.v = 0
          this.next.b = 0
        }

        for (const i in this.next) {
          this.last[i] = this[i]
          this[i] = this.next[i]
        }

      }
      bump() {
        for (const that of Game.grains) {
          if (this==that) continue
          if (Math.abs(that.next.x-this.next.x)<this.w) {
            if (Math.abs(that.next.y-this.next.y)<this.h) {

              let cx=(this.next.x+that.next.x)/2
              let cy=(this.next.y+that.next.y)/2
              let dx=(this.next.x-that.next.x)
              let dy=(this.next.y-that.next.y)

              let theta1=Math.atan2(this.next.v,this.next.u)
              let theta2=Math.atan2(that.next.v,that.next.u)

              let phi=Math.atan2(dy,dx) 

              let blob1=that.next.u*Math.cos(theta2-phi)/Math.cos(theta2)
              let blob2=this.next.u*Math.sin(theta1-phi)/Math.cos(theta1)


              this.x = cx+this.w*Math.cos(phi)/2
              this.y = cy+this.h*Math.sin(phi)/2

              this.u = blob1*Math.cos(phi) + blob2*Math.sin(phi)
              this.v = blob1*Math.sin(phi) - blob2*Math.cos(phi)

              let ctx=CTX['map']
              ctx.save()
              ctx.beginPath()
              ctx.arc(this.x,this.y,this.w,0,Math.PI*2)
              ctx.strokeStyle='white'
              ctx.stroke()
              ctx.beginPath()
              ctx.arc(that.x,that.y,that.w,0,Math.PI*2)
              ctx.strokeStyle='white'
              ctx.stroke()
              ctx.restore()
            }
          }
        }
      }
      draw(ctx=CTX['map']) {
        ctx.save()
        ctx.beginPath()
        ctx.arc(this.x,this.y,this.w/2,0,Math.PI*2)
        ctx.fillStyle=`hsl(${this.hue*97} 50 50)`
        ctx.fill()
        ctx.beginPath()
        ctx.moveTo(this.last.x,this.last.y)
        ctx.lineTo(this.next.x,this.next.y)
        ctx.strokeStyle='white'
        ctx.stroke()
        ctx.restore()
      }
    }

    Game.grains.push(new Grain())
    Game.grains.push(new Grain())
    Game.grains.push(new Grain())
    


</script>
</body>
</html>
