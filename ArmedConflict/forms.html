    ul {

      padding-left: 0.5ch;
    }
    li {
      list-style-type: '| ';
      outline: 1px solid grey;
      margin-inline-start: 3.5ch;
      padding-inline-start: 0.5ch;
      li {

        outline: 1px solid grey;

        padding-inline-start: 0.5ch;

                }
              }
            }
          }
        }
      }
    }
    div {
      display: grid;
      /* gap: 1px; */
      /* grid-auto-flow: column; */
    }
    a {
      display: grid; gap: 1ch;
      grid-template-columns: 6.2ch 5.5ch 1fr 2fr;
    }
    i,o {
      color: hsl(100 50 50);
      display: inline-block;
      font-style: normal;
      letter-spacing: -6px;
      scale: 2 0.5;
      text-align: center;
    }
    o {
      color: hsl(045 50 50);
    }
    r {
      color: hsl(000 50 50);
    }
  </style>

    let count=0

    class Soldier {
      constructor(info,index) {
        this.count = ++count
        for (const attr in info) {
          this[attr] = info[attr]
        }
        this.index = index
      }
      get markUp() {
        console.log('marking up',this)
        return `
        <div>
          <a>
            ${this.count}_${this.index/*parseInt(this.index,3)+1*/}
            <${this.officer?'o':'i'}>${Ranks[this.rank].insignia}</${this.officer?'o':'i'}>
            <b>${Ranks[this.rank].name}</b>
            <r>${this.role}</r>
          </a>
        </div>
        `
      }
    }

    class Formation {
      constructor(size='Platoon',i=0,subList) {
        console.log(size)
        if (size=="Soldier") return new Soldier(i)
        this.size = size
        this.index = i
        this.subList = subList??subSet[this.size]
        this.subs = []
        this.init()
      }
      init () {
        let n=0
        for (const sub of this.subList) {
          if (subSet[sub]) {
            this.subs.push(new Formation(sub,`${this.index}${n++}`))
          } else {
            this.subs.push(new Soldier(sub,`${this.index}${n++}`))
          }
        }
      }
      get markUp() {
        console.log('marking up',this)
        return `
        <div>
          <a>
            ${parseInt(this.index,3)}
            <b>${this.index}</b>
            ${this.size}
          </a>
          <ul>
            ${this.subs.map(sub=>`<li>${sub.markUp}</li>`).join('')}
          </ul>
        </div>
        `
      }
    }
