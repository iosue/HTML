function createLayers() {
  for (let layer of settings.layers) {
    if (layer.live) {
      CVS[layer.name] = document.createElement('canvas')
      CVS[layer.name].height = innerHeight
      CVS[layer.name].width = innerWidth
      CVS[layer.name].id = layer.name
      document.body.appendChild(CVS[layer.name])
    } else CVS[layer.name] = new OffscreenCanvas(layer.w??canvasWidth,layer.h??canvasHeight)
    CTX[layer.name] = CVS[layer.name].getContext('2d')
    CTX[layer.name].lineCap = "round"
    CTX[layer.name].lineJoin = "round"
    CTX[layer.name].font=`${tileSize/6}px consolas`
    CTX[layer.name].textAlign = "center"
    CTX[layer.name].textBaseline = "middle"
  }
}

function createMap(ctx=CTX['bmp']) {
  ctx.fillStyle='hsl(100 15 15)'
  ctx.fillRect(0,0,canvasWidth,canvasHeight)

  ctx.translate(mapBorder,mapBorder)
  for (let j=0;j<mapJ;j++)
  for (let i=0;i<mapI;i++) {
    let newTile = new Tile(i,2*j+(i+1)%2,mapData1[j][i])
    Game.terrain[i]??=[]
    Game.terrain[i][2*j+(i+1)%2] = newTile
  }

  for (const road of roads1) Game.terrain[road[0]][road[1]].roads = road[2]
  // for (const tile of roads2) Game.terrain[tile[0]][tile[1]].roads = tile[2]

  for (const city of cities1) Game.terrain[city[0]][city[1]].name = city[2]
  // for (const city of cities2) Game.terrain[city[0]][city[1]].name = city[2]

  Game.terrain.flat().forEach(tile=>tile.draw(CTX['bmp'],true))

  ctx.beginPath()
  ctx.rect(canvasWidth-mapBorder,canvasHeight-mapBorder/2,-570,760)
  ctx.fill()
  ctx.lineWidth=20
  ctx.strokeStyle='black'
  ctx.stroke()
  ctx.lineWidth=10
  ctx.strokeStyle='white'
  ctx.stroke()

  ctx.translate(canvasWidth-mapBorder-570/2,canvasHeight-mapBorder/2+100)
  ctx.font='64px consolas'
  ctx.fillStyle="white"
  ctx.fillText('ALLIANCES',0,0)

  ctx.fillStyle="hsl(0 0 25)"
  ctx.fillRect(0,50,-250,575)
  ctx.fillStyle="hsl(0 0 40)"
  ctx.fillRect(0,50,+250,575)
  ctx.lineWidth=4
  ctx.strokeRect(-250,50,500,575)

  ctx.lineWidth=4
  let shiftX=270,
      shiftY=shiftX*3/4

  ctx.beginPath()
  ctx.translate(-shiftX/2,130)
  ctx.moveTo(0,0)
  ctx.lineTo(+200,0)
  ctx.lineTo(+190,-10)
  ctx.moveTo(+200,0)
  ctx.lineTo(+190,+10)
  ctx.stroke()

  ctx.beginPath()
  ctx.arc(0,0,50,0,Math.PI*2)
  ctx.fillStyle='black'
  ctx.fill()
  ctx.stroke()

  ctx.beginPath()
  ctx.translate(+shiftX,0)
  ctx.moveTo(0,0)
  ctx.lineTo(-200,150)
  ctx.lineTo(-200+2,150-14)
  ctx.moveTo(-200,150)
  ctx.lineTo(-200+14,150+2)
  ctx.stroke()

  ctx.beginPath()
  ctx.arc(0,0,50,0,Math.PI*2)
  ctx.fillStyle='black'
  ctx.fill()
  ctx.stroke()

  ctx.beginPath()
  ctx.translate(-shiftX,shiftY)
  ctx.moveTo(0,0)
  ctx.lineTo(+200,0)
  ctx.lineTo(+190,-10)
  ctx.moveTo(+200,0)
  ctx.lineTo(+190,+10)
  ctx.stroke()

  ctx.beginPath()
  ctx.arc(0,0,50,0,Math.PI*2)
  ctx.fillStyle='black'
  ctx.fill()
  ctx.stroke()

  ctx.beginPath()
  ctx.translate(+shiftX,0)
  ctx.moveTo(0,0)
  ctx.lineTo(-200,150)
  ctx.lineTo(-200+2,150-14)
  ctx.moveTo(-200,150)
  ctx.lineTo(-200+14,150+2)
  ctx.stroke()

  ctx.beginPath()
  ctx.arc(0,0,50,0,Math.PI*2)
  ctx.fillStyle='black'
  ctx.fill()
  ctx.stroke()

  ctx.beginPath()
  ctx.translate(-shiftX,shiftY)
  ctx.moveTo(0,0)
  ctx.lineTo(+200,0)
  ctx.lineTo(+190,-10)
  ctx.moveTo(+200,0)
  ctx.lineTo(+190,+10)
  ctx.stroke()

  ctx.beginPath()
  ctx.arc(0,0,50,0,Math.PI*2)
  ctx.fillStyle='black'
  ctx.fill()
  ctx.stroke()

  ctx.beginPath()
  ctx.translate(+shiftX,0)
  ctx.arc(0,0,50,0,Math.PI*2)
  ctx.fillStyle='black'
  ctx.fill()
  ctx.stroke()

}

    new ReservePool( 'hsl(200 50 50)',2,2),
    new ReservePool( 'hsl(100 50 50)',2,3),

}

function refresh() {
  //reset layers
  for (let layer of settings.layers) {
    if (layer.live) {
      CVS[layer.name].width = innerWidth
      CVS[layer.name].height = innerHeight
      if (layer.scale) {
        CTX[layer.name].translate(innerWidth/2,innerHeight/2)
        CTX[layer.name].scale(1/C.z,1/C.z)
        CTX[layer.name].translate(-C.x,-C.y)
      }
    }
    CTX[layer.name].lineCap = "round"
    CTX[layer.name].lineJoin = "round"
    CTX[layer.name].font = "12px consolas"
    CTX[layer.name].textAlign = "center"
    CTX[layer.name].textBaseline = "middle"
  }

  Game.hovered = {}

  //draw loop
  CTX['map'].globalAlpha = 0.5
  CTX['map'].drawImage(CVS['bmp'],-mapBorder,-mapBorder)
  CTX['map'].lineWidth=20
  CTX['map'].strokeStyle='black'
  CTX['map'].strokeRect(-mapBorder,-mapBorder,canvasWidth,canvasHeight)
  CTX['map'].lineWidth=10
  CTX['map'].strokeStyle='white'
  CTX['map'].strokeRect(-mapBorder,-mapBorder,canvasWidth,canvasHeight)
  CTX['map'].globalAlpha = 1.0
  
  
  CTX['gui'].fillStyle='goldenrod'
  CTX['gui'].fillText('\\|/-'[Math.floor(++loop/6)%4],25,25)
  
  
  
  Game.units.forEach(unit=>unit.checkHover())
  Game.reserves.forEach(pool=>pool.draw(CTX['map']))
  Game.terrain.flat().forEach(hex=>hex.checkHover())
  Game.terrain.flat().forEach(tile=>tile.drawUnits())
  
  if (!pause)
    setTimeout(refresh,1000/60)
}
