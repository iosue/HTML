<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armed Conflict</title>
  <style>
    :root {
      color-scheme: dark;
    }
    canvas {
      position: fixed;
      inset: 0;
      color: hsl(60, 56%, 91%);
    }
  </style>
</head>
<body>
  <script src="./scripts/consts.js"></script>
  <script src="./scripts/helpers.js"></script>
  <script src="./scripts/listeners.js"></script>
  <script src="./classes/Tile.js"></script>
  <script src="./classes/Units.js"></script>
  <script>

// onload=()=>{
  createLayers()
  createMap()
  createUnits()
  refresh()
// }

function createLayers() {
  for (let layer of settings.layers) {
    if (layer.live) {
      CVS[layer.name] = document.createElement('canvas')
      CVS[layer.name].height = innerHeight
      CVS[layer.name].width = innerWidth
      CVS[layer.name].id = layer.name
      document.body.appendChild(CVS[layer.name])
    } else CVS[layer.name] = new OffscreenCanvas(layer.w??canvasWidth,layer.h??canvasHeight)
    CTX[layer.name] = CVS[layer.name].getContext('2d')
    CTX[layer.name].lineCap = "round"
    CTX[layer.name].lineJoin = "round"
    CTX[layer.name].font=`${tileSize/6}px consolas`
    CTX[layer.name].textAlign = "center"
    CTX[layer.name].textBaseline = "middle"
  }
}

function createMap(ctx=CTX['bmp']) {
  ctx.fillRect(0,0,10000,10000)

  ctx.translate(tileSize/Math.cos(Math.PI/6)/2,tileSize/2)
  for (let j=0;j<mapJ;j++)
  for (let i=0;i<mapI;i++) {
    let newTile = new Tile(i,2*j+(i+1)%2,mapData1[j][i])
    Game.terrain[i]??=[]
    Game.terrain[i][2*j+(i+1)%2] = newTile
  }

  for (const road of roads1) Game.terrain[road[0]][road[1]].roads = road[2]
  // for (const tile of roads2) Game.terrain[tile[0]][tile[1]].roads = tile[2]

  for (const city of cities1) Game.terrain[city[0]][city[1]].name = city[2]
  // for (const city of cities2) Game.terrain[city[0]][city[1]].name = city[2]

  Game.terrain.flat().forEach(tile=>tile.draw(CTX['bmp'],true))
}

function createUnits() {
  Game.units.push(
    new  BGEInfantry('hsl(100 50 50)',7,8),
    new  BTNInfantry('hsl(100 50 50)',7,8),
    new  BTNInfantry('hsl(100 50 50)',7,8),
    new   COYDragoon('hsl(100 50 50)',7,8),
    new   COYCavalry('hsl(100 50 50)',7,8),
    new   COYCavalry('hsl(100 50 50)',7,8),
    new COYArtillery('hsl(100 50 50)',7,8),

    new  BGEInfantry( 'hsl(200 50 50)',8,7),
    new  BGEInfantry( 'hsl(200 50 50)',8,7),
    new  BGEInfantry( 'hsl(200 50 50)',8,7),
    new  BTNInfantry( 'hsl(200 50 50)',8,7),
    new  BTNInfantry( 'hsl(200 50 50)',8,7),
    new  BTNInfantry( 'hsl(200 50 50)',8,7),
    new   BTNDragoon( 'hsl(200 50 50)',8,7),
    new   BTNDragoon( 'hsl(200 50 50)',8,7),
    new   BTNDragoon( 'hsl(200 50 50)',8,7),
    new  COYInfantry( 'hsl(200 50 50)',8,7),
    new  COYInfantry( 'hsl(200 50 50)',8,7),
    new  COYInfantry( 'hsl(200 50 50)',8,7),
    new   COYDragoon( 'hsl(200 50 50)',8,7),
    new   COYDragoon( 'hsl(200 50 50)',8,7),
    new   COYCavalry( 'hsl(200 50 50)',8,7),
    new   COYCavalry( 'hsl(200 50 50)',8,7),
    
    new   COYDragoon( 'hsl(000 50 50)',8,9),
    new   COYCavalry( 'hsl(000 50 50)',8,9),
    new   COYDragoon( 'hsl(000 50 50)',8,9),

    new   BTNDragoon(' hsl(050 50 50)',6,7),
    new   COYCavalry(' hsl(050 50 50)',6,7),
    new COYArtillery(' hsl(050 50 50)',6,7),

    new  BGEInfantry( 'hsl(500 00 80)',6,9),
    new  BTNInfantry( 'hsl(500 00 80)',6,9),
    new  COYInfantry( 'hsl(500 00 80)',6,9),

    new   COYDragoon( 'hsl(000 00 20)',7,10),
    new   COYCavalry( 'hsl(000 00 20)',7,10),
    new COYArtillery( 'hsl(000 00 20)',7,10),
  )
  Game.terrain.flat().forEach(tile=>tile.reorderUnits())
}

function refresh() {
  //reset layers
  for (let layer of settings.layers) {
    if (layer.live) {
      CVS[layer.name].width = innerWidth
      CVS[layer.name].height = innerHeight
      if (layer.scale) {
        CTX[layer.name].translate(innerWidth/2,innerHeight/2)
        CTX[layer.name].scale(1/C.z,1/C.z)
        CTX[layer.name].translate(-C.x,-C.y)
      }
    }
    CTX[layer.name].lineCap = "round"
    CTX[layer.name].lineJoin = "round"
    CTX[layer.name].font = "12px consolas"
    CTX[layer.name].textAlign = "center"
    CTX[layer.name].textBaseline = "middle"
  }

  Game.hovered = {}

  //draw loop
  CTX['map'].globalAlpha=0.5
  CTX['map'].drawImage(CVS['bmp'],-tileSize/Math.cos(Math.PI/6)/2,-tileSize/2)

  CTX['gui'].fillStyle='goldenrod'
  CTX['gui'].fillText('\\|/-'[Math.floor(++loop/6)%4],25,25)

  Game.terrain.flat().forEach(hex=>hex.draw())
  // Game.units.forEach(unit=>unit.draw())

  if (!pause)
    setTimeout(refresh,1000/60)
}

</script>

</body>
</html>
