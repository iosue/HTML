function createLayers() {
  for (let layer of settings.layers) {
    if (layer.live) {
      CVS[layer.name] = document.createElement('canvas')
      CVS[layer.name].height = innerHeight
      CVS[layer.name].width = innerWidth
      CVS[layer.name].id = layer.name
      document.body.appendChild(CVS[layer.name])
    } else CVS[layer.name] = new OffscreenCanvas(layer.w??canvasWidth,layer.h??canvasHeight)
    CTX[layer.name] = CVS[layer.name].getContext('2d')
    CTX[layer.name].lineCap = "round"
    CTX[layer.name].lineJoin = "round"
    CTX[layer.name].font = "9px consolas"
    CTX[layer.name].textAlign = "center"
    CTX[layer.name].textBaseline = "middle"
  }

  return createMap()
}

function createSprites(ctx=CTX['sprites']) {
  for (const mode in SpriteList) {
    Sprites[mode]??={}
    for (const pose in SpriteList[mode]) {
      Sprites[mode][pose]??=[]
      CVS[`${mode}_${pose}`] = new OffscreenCanvas(300*4,200*5)

      // CVS[`${mode}_${pose}`] = document.createElement('canvas')
      // CVS[`${mode}_${pose}`].width = 300*4
      // CVS[`${mode}_${pose}`].height = 200*5
      // document.body.appendChild(CVS[`${mode}_${pose}`])

      CTX[`${mode}_${pose}`] = CVS[`${mode}_${pose}`].getContext('2d')
      for (let i=0;i<SpriteList[mode][pose];i++) {
        let img = new Image()
        img.src=`./sprites/topDown/${mode}/${pose}/survivor-${pose}_${mode}_${i}.png`
        img.onload=()=>CTX[`${mode}_${pose}`].drawImage(img,300*(i%4),200*Math.floor(i/4))
      }
    }
  }
  return createPCs()
}

  )
  Game.PCs.push(
    new Soldier(1,"Rifleman",undefined,Game.terrain[5][5])
  )
  Game.activePC = Game.PCs[0]

  return createGUI()
}

function createGUI() {
  // pause=true
  Game.buttons=[]
  Game.hotkeys={}

  new Button(-400,64,(button)=>{
    let i=Game.pendingPCs.indexOf(Game.activePC)
        i+=Game.pendingPCs.length-1
        i%=Game.pendingPCs.length
    Game.activePC = Game.pendingPCs[i]
    if (Game.activePC) Game.activePC.focus = true
    delete Game.phase
  },'Prev PC',null,'Shift','ShiftLeft')

  new Button(-250,64,()=>{},'Move','plan_move',1,'Digit1')

  new Button(-150,64,()=>{},'Shoot','plan_shoot',2,'Digit2')

  new Button(-50,64,()=>{},'Suppress','plan_suppress',3,'Digit3')

  new Button(+50,64,()=>{},'Reload','plan_reload',4,'Digit4')

  new Button(+150,64,()=>{
      Game.activePC.done = true
      delete Game.phase
      Game.hotkeys['Tab'].click()
    },'End Turn','next_turn',9,'Digit9')

  new Button(+250,64,()=>{
        Game.PCs.forEach(pc=>{
          let carry = pc.energy.carry
          pc.energy.spent = 0
          pc.energy.costs = 0
          pc.energy.datum = carry
          delete pc.done
        })
      Game.activePC = Game.PCs[0]
      Game.activePC.focus = true
      delete Game.phase
    },'End Round','next_round',0,'Digit0')

  new Button(+400,64,(button)=>{
      let i=Game.pendingPCs.indexOf(Game.activePC)
          i+=Game.pendingPCs.length+1
          i%=Game.pendingPCs.length
      Game.activePC = Game.pendingPCs[i]
      console.log(Game.activePC)
      if (!Game.activePC) {
        console.log('end round')
        Game.hotkeys['Digit0'].click()
      } else {
        Game.activePC.focus = true
      }
      delete Game.phase
    },'Next PC',null,'Tab','Tab')

  onload=refresh
}

function refresh() {
  // console.log(Game.phase)
  //reset layers
  for (let layer of settings.layers) {
    if (layer.live) {
      CVS[layer.name].width = innerWidth
      CVS[layer.name].height = innerHeight
      if (layer.scale) {
        CTX[layer.name].translate(innerWidth/2,innerHeight/2)
        CTX[layer.name].scale(1/C.z,1/C.z)
        CTX[layer.name].translate(-C.x,-C.y)
        // CTX[layer.name].scale(10/10,9/10)
        // CTX[layer.name].rotate(Math.PI/12)
      }
    }
    CTX[layer.name].lineCap = "round"
    CTX[layer.name].lineJoin = "round"
    CTX[layer.name].font = "12px consolas"
    CTX[layer.name].textAlign = "center"
    CTX[layer.name].textBaseline = "middle"
  }

  if (Game.hoverButton || Game.hoverHex) {
    document.body.style.setProperty('cursor','default')
  } else {
    document.body.style.setProperty('cursor','default')
  }
  // delete Game.hoverButton
  // delete Game.hoverHex


  //draw loop
  CTX['map'].drawImage(CVS['bmp'],-tileSize,-tileSize*1)
  // CTX['test'].drawImage(CVS['rifle_idle'],0,0)

  // CTX['map'].strokeStyle='white'
  // CTX['map'].strokeRect(0,0,mapWidth,mapHeight)

  CTX['gui'].fillStyle='goldenrod'
  CTX['gui'].fillText('\\|/-'[Math.floor(++loop/6)%4],25,25)

  // displayUI()
  Game.terrain.flat().forEach(hex=>hex.hover())
  // Game.PCs.forEach(pc=>pc.update())

  if (!pause)
      // requestAnimationFrame(refresh)
    setTimeout(refresh,1000/60)
}

function displayUI(ctx=CTX['gui']) {
  ctx.save()
  Game.activePC.drawGauge(ctx)
  if (Game.phase?.match(/^wait/)) return

  ctx.translate(0,innerHeight-80)
  ctx.beginPath
  ctx.rect(0,0,innerWidth,-128)
  ctx.fillStyle=`hsl(200 50 20/0.30)`
  ctx.fill()
  ctx.font="13px slate"
  Game.buttons.forEach(b=>b.draw(ctx))

  ctx.beginPath()
  ctx.rect(0,80,innerWidth,-208)
  if (ctx.isPointInPath(M.x,M.y)) {
    Game.hoverHex=null
  } else {
    delete Game.hoverHex
  }
  ctx.restore()
}
