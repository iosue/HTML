<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water</title>
  <style>
    :root {
      color-scheme: dark;
    }
    canvas {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <script>

    const tileSize=100,
          mapWidth=tileSize*10,
          mapHeight=tileSize*10,
          settings={
            layers:[
              {name:"bmp",},
              {name:"map",live:true,scale:true},
              {name:"gui",live:true,}        
            ],
          },
          CVS={},CTX={},K={},
          C={x:mapWidth/2,y:mapHeight/2,z:2,v:10/9},
          M={
            b:{},
            get sx() {return (this.x-innerWidth/2)*C.z},
            get sy() {return (this.y-innerHeight/2)*C.z}
          },
          Game={
            locations:[],
            terrain:[],
          }
    let pause=false, mode='createMap', loop=0

    addEventListener('contextmenu',e=>{
      if (!e.ctrlKey) e.preventDefault()
    })
    addEventListener('mousemove',e=>{
      M.x=e.x
      M.y=e.y
      if (M.b[1]) {
        C.x-=e.movementX*C.z
        C.y-=e.movementY*C.z
      }
    })
    addEventListener('mousedown',e=>M.b[e.button]=true)
    addEventListener('mouseup',e=>delete M.b[e.button])
    addEventListener('wheel',e=>{
      if (K['KeyM']) {
        R-=20*Math.sign(e.deltaY)
        R=Math.max(0,R)
      } else {
        C.x+=M.sx
        C.y+=M.sy
        C.z*=C.v**Math.sign(e.deltaY)
        C.y-=M.sy
        C.x-=M.sx
      }
    })
    addEventListener('keydown',e=>{
      if (e.code=='Escape') {
        pause=!pause
        if (!pause) refresh()
        console.log(pause?'pause':'resume')
      } else
        K[e.code]=true
    })
    addEventListener('keyup',e=>{delete K[e.code]})

    onload=()=>{
      createLayers()
      createMap()
      refresh()
    }


    function createLayers() {
      for (let layer of settings.layers) {
        if (layer.live) {
          CVS[layer.name] = document.createElement('canvas')
          CVS[layer.name].height = innerHeight
          CVS[layer.name].width = innerWidth
          CVS[layer.name].id = layer.name
          document.body.appendChild(CVS[layer.name])
        } else CVS[layer.name] = new OffscreenCanvas(mapWidth,mapHeight)
        CTX[layer.name] = CVS[layer.name].getContext('2d')
        CTX[layer.name].lineCap = "round"
        CTX[layer.name].lineJoin = "round"
        CTX[layer.name].font = "12px consolas"
        CTX[layer.name].textAlign = "center"
        CTX[layer.name].textBaseline = "middle"
      }
    }

    function createMap(ctx=CTX['bmp']) {
      for (let j=0;j<mapWidth/tileSize;j++)
      for (let i=0;i<mapWidth/tileSize;i++) {
        Game.terrain[j]??=[]
        Game.terrain[j][i] = new Meter(i,j)
      }
    }
    
    function refresh() {
      //reset layers
      for (let layer of settings.layers) {
        if (layer.live) {
          CVS[layer.name].width = innerWidth
          CVS[layer.name].height = innerHeight
          if (layer.scale) {
            CTX[layer.name].translate(innerWidth/2,innerHeight/2)
            CTX[layer.name].scale(1/C.z,1/C.z)
            CTX[layer.name].translate(-C.x,-C.y)
          }
        }
        CTX[layer.name].lineCap = "round"
        CTX[layer.name].lineJoin = "round"
        CTX[layer.name].font = "64px consolas"
        CTX[layer.name].textAlign = "center"
        CTX[layer.name].textBaseline = "middle"
      }

      //draw loop
      CTX['map'].drawImage(CVS['bmp'],0,0)

      CTX['gui'].fillStyle='goldenrod'
      CTX['gui'].fillText('\\|/-'[Math.floor(++loop/1)%4],50,50)

      if (mode=='createMap') {
        let empty = Game.terrain.flat().filter(m=>!m.z)
        if (empty.length) {
          let i=Math.floor(Math.random()*empty.length)
          let newMeter = empty[i]
          let rand = Math.random()*20-10
          newMeter.k = Math.round((rand + newMeter.neighbourAverage*3)/4)
          newMeter.draw(CTX['bmp'])
          ctx=CTX['gui']
          ctx.fillStyle='goldenrod'
          let width=(Game.terrain.flat().length-empty.length)/Game.terrain.flat().length*innerWidth
          ctx.fillRect(0,0,width,1)
          requestAnimationFrame(refresh)
        } else {
          mode='rain'
          // setTimeout(refresh,1000/1)
        }
      }
      if (mode=='rain') {
        let flatMap = Game.terrain.flat()
        for (const tile of flatMap) tile.drain()
        for (const tile of flatMap) tile.fill()
        if (!pause)
          setTimeout(refresh,1000/6)
      }

    }

    class Meter {
      constructor (i,j,k) {
        this.i = i
        this.j = j
        this.k = k
        this.depth = 1
        this.flowOut = 0
        this.flowIn = 0
      }
      get x() {return this.i*tileSize}
      get y() {return this.j*tileSize}
      get z() {return this.k+10}
      get hue() {return 100-((this.z/2)**3)/4 || ''}
      get neighbours() {
        const nList = [],
          check = n=>{if (n) nList.push(n)}
        check(Game.terrain[this.j-1]?.[this.i-1])
        check(Game.terrain[this.j-1]?.[this.i])
        check(Game.terrain[this.j-1]?.[this.i+1])
        check(Game.terrain[this.j]?.[this.i-1])
        check(Game.terrain[this.j]?.[this.i+1])
        check(Game.terrain[this.j+1]?.[this.i-1])
        check(Game.terrain[this.j+1]?.[this.i])
        check(Game.terrain[this.j+1]?.[this.i+1])
        return nList
      }
      get neighbourAverage() {
        let nList=[]
        for (const that of this.neighbours) {
          if (that.k) {
            nList.push(that.k)
            if (this.i==that.i || this.j==that.j) {
              nList.push(that.k)
            }
          }
        }
        return (nList.reduce((sum,curr)=>sum+curr,0)/nList.length)||0
      }
      get waterLevel() {
        return this.k + this.depth
      }
      draw(ctx=CTX['bmp']) {
        ctx.save()
        ctx.fillStyle = `hsl(${this.hue} 50 50)`
        ctx.fillRect(this.x,this.y,tileSize,tileSize)
        ctx.fillStyle = `hsl(0 0 100)`
        ctx.fillText(this.k??'',this.x+tileSize/2,this.y+tileSize/2)
        ctx.restore()
      }
      get lowestNeighbours() {
        let nList=[]
        for (const that of [this,...this.neighbours]) {
          if (nList.length && that.waterLevel<nList[0].waterLevel)
            nList.length = 0
          if (!nList.length || that.waterLevel==nList[0].waterLevel)
            nList.push(that)
        }
        return nList
      }
      drawDepth(ctx=CTX['map']) {
        if (this.depth>0) {
          ctx.save()
          ctx.translate(this.x+tileSize/2,this.y+tileSize/2)
          ctx.beginPath()
          ctx.arc(0,0,this.depth*100,0,Math.PI*2)
          ctx.fillStyle=`hsl(200 50 50/0.5)`
          ctx.fill()
          ctx.restore()
        }
      }
      drawFlow(ctx=CTX['map']) {
        ctx.save()
        ctx.translate(tileSize/2,tileSize/2)
        ctx.translate(this.x,this.y)
        for (const that of this.lowestNeighbours) {
          ctx.save()
          ctx.beginPath()
          ctx.arc(0,0,10,0,Math.PI*2)
          ctx.moveTo(0, 0)
          // ctx.scale(0.65,0.65)
          ctx.lineTo(that.x-this.x, that.y-this.y)
          ctx.restore()
        }
        ctx.lineCap="butt"
        ctx.lineWidth=this.flowOut
        ctx.strokeStyle="#0003"
        ctx.stroke()
        ctx.restore()
      }
      drain() {
        this.flowOut = Math.round(this.depth/this.lowestNeighbours.length*100)/100
        // console.log(this.depth,this.flowOut)
        for (const that of this.lowestNeighbours) {
          that.flowIn += this.flowOut
        }
        this.depth -= this.flowOut
        // this.depth -= 1
        // this.drawDepth()
      }
      fill() {
        // console.warn(this.flowIn)
        this.depth += this.flowIn
        this.flowIn = 0
        this.drawFlow()
      }
    }

</script>

</body>
</html>
