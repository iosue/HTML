class Tile {
  constructor(i,j,roads,n) {
    this.i = i
    this.j = j

    this.i=(n-1)%6
    this.j=Math.floor((n-1)/6)

    this.n = n
    this.roads = roads
    this.w = 100
    this.h = 100/Math.cos(Math.PI/6)
  }
  get x() {return (this.i+(this.j%2)/2)*this.w}
  get y() {return this.j*this.h*3/4}
  draw(ctx) {
    ctx.save()
    ctx.translate(this.x,this.y)
    ctx.scale(0.95,0.95)
    ctx.beginPath()
    ctx.lineTo(+this.w*0,-this.h/2)
    ctx.lineTo(+this.w/2,-this.h/4)
    ctx.lineTo(+this.w/2,+this.h/4)
    ctx.lineTo(-this.w*0,+this.h/2)
    ctx.lineTo(-this.w/2,+this.h/4)
    ctx.lineTo(-this.w/2,-this.h/4)
    ctx.fillStyle='hsl(100 30 30)'
    ctx.fill()
    ctx.clip()

    ctx.beginPath()
    for (let d of this.roads) {
      ctx.save()
      ctx.moveTo(0,0)
      ctx.rotate(d*Math.PI/3)
      ctx.lineTo(this.w/2,0)
      ctx.restore()
    }
    ctx.lineWidth = 10
    ctx.strokeStyle='hsl(100 10 90)'
    ctx.stroke()

    ctx.beginPath()
    ctx.font = '50px consolas'
    ctx.fillStyle = '#fff1'
    ctx.fillText(this.n,0,0)

    ctx.restore()
  }
}

function createLayers() {
  for (let layer of settings.layers) {
    if (layer.live) {
      CVS[layer.name] = document.createElement('canvas')
      CVS[layer.name].height = innerHeight
      CVS[layer.name].width = innerWidth
      CVS[layer.name].id = layer.name
      document.body.appendChild(CVS[layer.name])
    } else CVS[layer.name] = new OffscreenCanvas(layer.w??canvasWidth,layer.h??canvasHeight)
    CTX[layer.name] = CVS[layer.name].getContext('2d')
    CTX[layer.name].lineCap = "round"
    CTX[layer.name].lineJoin = "round"
    CTX[layer.name].font = "9px consolas"
    CTX[layer.name].textAlign = "center"
    CTX[layer.name].textBaseline = "middle"
  }
  onload=refresh
}

let counter=0

function refresh() {
  for (let layer of settings.layers) {
    if (layer.live) {
      CVS[layer.name].width = innerWidth
      CVS[layer.name].height = innerHeight
      if (layer.scale) {
        CTX[layer.name].translate(innerWidth/2,innerHeight/2)
        CTX[layer.name].scale(1/C.z,1/C.z)
        CTX[layer.name].translate(-C.x,-C.y)
