  <style>
    :root {
      color-scheme: dark;
    }
    *, *::before, *::after {
      --lineColor: hsl(0 50 50/0.5);
      box-sizing: border-box;
      font-family: consolas;
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
      text-align: center;
      text-wrap: nowrap;
    }
    *::before, *::after {
      display: block;
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
      z-index: -1;
    }


    ul {
      display: grid;
      grid-auto-flow: column;
      padding-top: 0.5rlh;
      &:not(:empty)::before {
        background: var(--lineColor);
        content:'';
        left: calc(50% - 0.5px);
        right: calc(50% - 0.5px);
        width: auto;
        height: 0.5rlh;
      }
    }
    body>li {
      display: block;
      width: fit-content;
      &::before, &::after {
        content: none;
      }
    }
    li {
      padding: 0.5rlh 1ch 0;
      place-items: center;
      position: relative;
      text-align: center;
      &::before, &::after {
        border: 1px solid var(--lineColor);
        content: '';
        width: calc(50% + 0.5px);
        height: 0.5rlh;
      }
      &::before {
        border-width: 1px 1px 0px 0px;
        right: calc(50% - 0.5px);
      }
      &::after {
        border-width: 1px 0px 0px 1px;
        left: calc(50% - 0.5px);
      }
      &:first-of-type::before, &:last-of-type::after {
        border-top: none;
      }
      label {
        border: 1px solid;
        display: block;
        height: 1rlh;
        width: 2rlh;
        margin-top: 1rlh;
        input {display: none;}
        &>:not(f,a) {
          display: none;
        } 
        &>f {
          position: absolute;
          left: 0; right: 0;
          bottom: 100%;
        }
        &>a {
          position: absolute;
          margin-left: 1ch;
          left: 100%; right: auto;
        }
        &:has(:checked)+ul {
          display: none;
        }
      }
    }

    .sdr {
      padding-inline: 0.5ch;
      &>a {
        border: 1px solid;
        border-radius: 50%;
        display: block;
        place-content: center;
        height: 2rlh;
        width: 2rlh;
        &>:is(e,m,n,o,w) {
          display: inline-block;
          justify-self: center;
          letter-spacing: -.7ch;
          scale: 1.5 0.5;
          /* text-align: center; */
          translate: -21% 2px;
          width: 3em;
        }
        &>:not(e,m,n,o,w) {display:none}
      }
    }

    li:has(>ul>:only-child) {
      &>label {
        display:none;
      }
      &>ul {
        margin-top: -1rlh;
        &::before {
          content: none;
        }
      }
    }

  </style>
</head>

            <r>${this.role}</r>

        </li>
        `
      }

    class Formation {
      constructor(override) {
        this.index = "SR "
        this.iLength=8
        for (const attr in override) {
          this[attr] = override[attr]
        }
      }
      renumber() {
        for (const s in this.subs) {
          if (!this.subs[s]) continue
          this.subs[s].index = this.index+''+s
          this.subs[s].iLength = this.iLength
          this.subs[s].renumber?.()
        }
        return this
      }
      assign(assignments) {
        for (const index in assignments) {
          let i=String(index), subject=this
          while (i) {
            subject = subject?.subs[i[0]]
            i=i.slice(1)
          }
          console.log(this,index,subject)
          for (const attr in assignments[index]) {
            subject[attr] = assignments[index][attr]
          }
        }
        return this
      }
      get markup() {
        return `
        <li class='${this.abbr}'>
          <label title="${this.name??this.ordinal??this.size}">
            <f>${this.symbol}</f>
            <i>(${this.index})</i>
            <a>${this.name??this.ordinal??this.size}</a>
            <input type="checkbox"/>
          </label>
          <ul>
          ${this.subs.map(sub=>sub?.markup).join('')}
          </ul>
        </li>
        `
      }
