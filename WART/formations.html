  <style>
    :root {
      color-scheme: dark;
      font-family: consolas;
      /* font-size: 8px; */
      text-wrap: nowrap;
    }
    div {
      display: inline-block;
      outline: 1px solid grey;
      padding: 0.5em;
      a {
        display: grid;
        grid-template-columns: auto auto 1fr;
        f {
          color: hsl(200 50 50);
        }
        i {
          color: grey;
          font-style: normal;
          padding-right: 0.5em;
          text-align: right;
        }
        e, m, n, o, w {
          display: inline-block;
          letter-spacing: -.7ch;
          scale: 2 0.5;
          text-align: center;
          translate: -1ch;
          width: 3em;
        }
        e {
          color: hsl(090 35 50);
        }
        m {
          color: hsl(000 75 50);
        }
        n {
          color: hsl(120 35 50);
        }
        o {
          color: hsl(045 75 50);
        }
        w {
          color: hsl(150 35 50);
        }
      }
      ul {
        display: grid;
        gap: 1px;
        grid-auto-columns: 1fr;
        list-style: none;
        margin: 0;
        padding: 0;
        li {
          margin: 0;
          padding: 1em;
        }
      }
    }

    .ftm>ul {
      grid-auto-flow: row;
    }
    .sqd>ul {
      grid-auto-flow: column;
    }
    .sec>ul {
      grid-auto-flow: row;
    }
    .col>ul {
      grid-auto-flow: column;
    }
    .ech>ul {
      grid-auto-flow: row;
    }
    .coy>ul {
      grid-auto-flow: column;
    }
    .btn>ul {
      grid-auto-flow: row;
    }
    .rgt>ul {
      grid-auto-flow: column;
    }
    .cht>ul {
      grid-auto-flow: row;
    }

    /* .sdr a>:last-child {display: none} */

    /* .sqd>ul {
      display: none;
    } */
  </style>

    class Soldier {
      constructor(rank,role,index) {
        this.count = ++count
        this.rank = rank
        this.role = role
        this.index = index
      }
      get markup() {
        return `
        <div class="sdr">
          ${this.index.length!=8?'<font color=red>':''}
          <a>
            <i>${this.count} (${this.index})</i>
            <${this.rank>20?'w':this.rank>10?'o':this.rank==10?'m':this.rank>3?'n':'e'} title="${Ranks[this.rank].name}">
              ${Ranks[this.rank].insignia}
            </${this.rank>20?'w':this.rank>10?'o':this.rank==10?'m':this.rank>3?'n':'e'}>
            <r>${this.role}</r>
          </a>
          ${this.index.length!=8?'</font>':''}
        </div>
        `
      }
    }


    class Formation {
      constructor(i=0,override) {
        this.index = i
        for (const attr in override) {
          this[attr] = override[attr]
        }
        this.renumber()
      }
      renumber() {
        for (const s in this.subs) {
          this.subs[s].index = this.index+s
        }
      }
      assign(assignments) {
        for (const index in assignments) {
          let i=index, subject=this
          while (i) {
            subject = subject?.subs[i[0]]
            i=i.slice(1)
          }
          for (const attr in assignments[index]) {
            subject[attr] = assignments[index][attr]
          }
        }
        return this
      }
      get markup() {
        return `
        <div class='${this.abbr}'>
          <a>
            <f>
              ${this.symbol}
              <i>(${this.index})</i>
            </f>
            ${this.name??this.size}
          </a>
          <ul>
          ${this.subs.map(sub=>sub.markup).join('')}
          </ul>
        </div>
        `
      }
    }
