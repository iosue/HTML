<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    :root {
      color-scheme: dark;
    }
    canvas {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <script>
    let pause=false
    const CVS={}, CTX={},
          canvasLayers=[
            {
              name:"bmp",
              screen:false,
              clear:false,
              scale:false,
            },
            {
              name:"map",
              screen:true,
              clear:true,
              scale:true,
            },
            {
              name:"agt",
              screen:true,
              clear:true,
              scale:true,
            },
            {
              name:"gui",
              screen:true,
              clear:true,
              scale:false,
            },
          ],
          M={B:{}},
          bitMap=[],
          agents=[],
          mapData=[ String().padStart(52),
            " 111111111111111111111111111111111111111111111111111",
            " 111222222222222222222222111222222222222222222222211",
            " 112000000000000000000002112000000000000000000000211",
            " 112022222222220222222222111222202222222222222220211",
            " 112021111111120211111111111111202111111111111120211",
            " 112021111111112211111111111111202111111111111120211",
            " 112021111111111111111111111111202111111111111120211",
            " 112021111111111111111111111111202111111111111120211",
            " 112021111111122111111111111111202111111111111120211",
            " 112021111111120211111111111111202111111111111120211",
            " 112022211122220222111222222222202222222211122220211",
            " 112000021120000000211200000000000000000021120000211",
            " 112022211122220222111222202222222222022211122220211",
            " 112021111111120211111111202111111112021111111120211",
            " 112021111111120211111111221111111112021111111120211",
            " 112021111111120211111111111111111112021111111120211",
            " 112021111111120211111111111111111112021111111120211",
            " 112021111111120211111111122111111112021111111120211",
            " 112021111111120211111111202111111112021111111120211",
            " 112022221112220222222222202222111222022221112220211",
            " 112000021120000000000000000002112000000021120000211",
            " 112022221112222222202222222222111222022221112220211",
            " 112021111111111111202111111111111112021111111120211",
            " 112021111111111111202111111111111111221111111120211",
            " 112021111111111111202111111111111111111111111120211",
            " 112021111111111111202111111111111111111111111120211",
            " 112021111111111111202111111111111112211111111120211",
            " 112021111111111111202111111111111112021111111120211",
            " 112022222222222222202221112222222222022222222220211",
            " 112000000000000000000002112000000000000000000000211",
            " 112222222222222222222221112222222222222222222222111",
            " 111111111111111111111111111111111111111111111111111"
          ],
          mapDefs={width:18,height:18/Math.cos(Math.PI/6)},
          C={
            x:(mapData[0].length-1/2)*mapDefs.width/2,
            y:mapData.length*mapDefs.height*3/8,
            z:1, s:10/9
          }
    let hoveredCell = false

    addEventListener('mousemove',e=>{
      M.x=e.x; M.y=e.y
      if (M.B[1]) {
        C.x -= e.movementX/C.z
        C.y -= e.movementY/C.z
      }
    })
    addEventListener('mousedown',e=>{ M.B[e.button] = true })
    addEventListener('mouseup',  e=>{ delete M.B[e.button] })
    addEventListener('wheel',e=>{
      C.x+=(M.x-innerWidth/2)/C.z
      C.y+=(M.y-innerHeight/2)/C.z
      C.z/=C.s**Math.sign(e.deltaY)
      C.y-=(M.y-innerHeight/2)/C.z
      C.x-=(M.x-innerWidth/2)/C.z
    })

    onload=()=>{
      for (const layer of canvasLayers) {
        if (layer.screen) {
          CVS[layer.name] = document.createElement('canvas')
          CVS[layer.name].id = layer.name
          CVS[layer.name].width = innerWidth
          CVS[layer.name].height = innerHeight
          document.body.appendChild(CVS[layer.name])
        } else {
          CVS[layer.name] = new OffscreenCanvas((mapData[0].length-1/2)*mapDefs.width,(mapData.length)*mapDefs.height*3/4)
        }
        CTX[layer.name] = CVS[layer.name].getContext('2d')
      }
      createMap()
    }
    
    function createMap(ctx=CTX['bmp']) {
      ctx.save()
      ctx.fillStyle='hsl(100 20 20)'
      ctx.fillRect(0,0,CVS['bmp'].width,CVS['bmp'].height)
      // ctx.translate(mapDefs.width*3/4,mapDefs.height*1/2)
      ctx.strokeStyle='hsl(200 50 50)'
      
      for (const j in mapData) {
        bitMap[j]=[]
        for (const i in mapData[j]) {
          let tile = new hexTile(i,j,mapData[j][i])
          bitMap[j][i] = tile
          tile.draw()
        }
      }
      ctx.restore()
      agents.push(new Agent(30,20))
      refresh()
    }

    function refresh() {
      for (const layer of canvasLayers) {
        if (layer.clear) {
          CVS[layer.name].width = innerWidth
          CVS[layer.name].height = innerHeight
        }
        if (layer.scale) {
          CTX[layer.name].translate(innerWidth/2,innerHeight/2)
          CTX[layer.name].scale(C.z,C.z)
          CTX[layer.name].translate(-C.x,-C.y)
        }
      }

      CTX['map'].drawImage(CVS['bmp'],0,0)
        
      bitMap.flat().forEach(tile=>tile.draw(CTX['map']))
      agents.forEach(agent=>agent.draw(CTX['map']))

      if (!pause) requestAnimationFrame(refresh)
    }

    class hexTile {
      constructor(i,j,k) {
        this.i = Number(i)
        this.j = Number(j)
        this.k = Number(k)
        this.w = this.width = mapDefs.width
        this.h = this.height = mapDefs.height
        this.x = (this.i-this.j%2/2)*this.width
        this.y = (this.j*3/4)*this.height
      }
      get neighbours() {
        let nList=[]
        test(this.i-this.j%2,this.j-1)
        test(this.i+1-this.j%2,this.j-1)
        test(this.i-1,this.j)
        test(this.i+1,this.j)
        test(this.i-this.j%2,this.j+1)
        test(this.i+1-this.j%2,this.j+1)
        return nList
        function test(i,j) {
          if (mapData[j]?.[i]>0) nList.push(bitMap[j][i])
        }
      }
      get path() {
        let ctx = new Path2D()
        ctx.lineTo(this.x+this.w*0, this.y-this.h/2)
        ctx.lineTo(this.x+this.w/2, this.y-this.h/4)
        ctx.lineTo(this.x+this.w/2, this.y+this.h/4)
        ctx.lineTo(this.x-this.w*0, this.y+this.h/2)
        ctx.lineTo(this.x-this.w/2, this.y+this.h/4)
        ctx.lineTo(this.x-this.w/2, this.y-this.h/4)
        ctx.closePath()
        return ctx
      }
      draw(ctx=CTX['bmp']) {
        if (this.i==0||this.j==0) return
        ctx.save()
        ctx.beginPath()
        // ctx.translate(mapDefs.width*3/4,mapDefs.height*1/2)
        ctx.translate(this.x,this.y)
        ctx.lineTo(+this.x*0,-this.h/2)
        ctx.lineTo(+this.w/2,-this.h/4)
        ctx.lineTo(+this.w/2,+this.h/4)
        ctx.lineTo(-this.x*0,+this.h/2)
        ctx.lineTo(-this.w/2,+this.h/4)
        ctx.lineTo(-this.w/2,-this.h/4)
        ctx.closePath()
        ctx.clip()
        ctx.strokeStyle=[
          '#ffff',
          '#fff2',
          '#fff1',
          'hsl(50 30 30)',
          'hsl(50 25 25)',
        ][this.k]
        ctx.stroke()
        if (this.i%2) {
          ctx.fillStyle='#1111'
          ctx.fill()
        }
        ctx.restore()
        if (ctx.isPointInPath(M.x,M.y)) {
          hoveredCell = this
          this.highlight()
        }
      }
      fill(cover,ctx=CTX['map'],color) {
        ctx.save()
        ctx.beginPath()
        ctx.translate(this.x,this.y)
        ctx.lineTo(+this.w*0,-this.h/2)
        ctx.lineTo(+this.w/2,-this.h/4)
        ctx.lineTo(+this.w/2,+this.h/4)
        ctx.lineTo(-this.w*0,+this.h/2)
        ctx.lineTo(-this.w/2,+this.h/4)
        ctx.lineTo(-this.w/2,-this.h/4)
        ctx.closePath()
        ctx.clip()
        ctx.fillStyle=color??`hsl(200 ${cover?0:25} 25)`
        ctx.fill()
        ctx.restore()
      }
      infill(color,ctx=CTX['map']) {
        ctx.save()
        ctx.beginPath()
        ctx.translate(this.x,this.y)
        ctx.scale(0.75,0.75)
        ctx.lineTo(+this.w*0,-this.h/2)
        ctx.lineTo(+this.w/2,-this.h/4)
        ctx.lineTo(+this.w/2,+this.h/4)
        ctx.lineTo(-this.w*0,+this.h/2)
        ctx.lineTo(-this.w/2,+this.h/4)
        ctx.lineTo(-this.w/2,-this.h/4)
        ctx.closePath()
        ctx.clip()
        ctx.fillStyle=color??`hsl(150 25 25)`
        ctx.fill()
        ctx.restore()
      }
      highlight(ctx=CTX['agt']) {
        if (this.k>0) {
          for (const neighbour of [this,...this.neighbours])
            neighbour.fill(this.k>1)
          ctx.save()
          ctx.translate(this.x,this.y)
          ctx.textAlign='center'
          ctx.textBaseline='middle'
          ctx.fillStyle='white'
          ctx.fillText(`${this.i}:${this.j}`,0,0)
          ctx.beginPath()
          ctx.arc(0,0,20,0,Math.PI*2)
          ctx.stroke()
          ctx.restore()
        }
      }
      isPointInPath(x,y,ctx=CTX['map']) {
        ctx.save()
        ctx.beginPath()
        ctx.translate(-1*mapDefs.width*3/4,-1*mapDefs.height*1/2)
        ctx.translate(this.x,this.y)
        ctx.lineTo(+this.w*0,-this.h/2)
        ctx.lineTo(+this.w/2,-this.h/4)
        ctx.lineTo(+this.w/2,+this.h/4)
        ctx.lineTo(-this.w*0,+this.h/2)
        ctx.lineTo(-this.w/2,+this.h/4)
        ctx.lineTo(-this.w/2,-this.h/4)
        ctx.closePath()
        let inPath=false
        if (ctx.isPointInPath(x,y)) {
          inPath=true
        }
        ctx.restore()
        ctx.save()
        ctx.beginPath()
        ctx.fillStyle='goldenrod'
        ctx.fillRect(x-2,y-2,4,4)
        ctx.restore()
        return inPath
      }
      intersects(source,angle,distance) {
        for (let d=0;d<distance;d++) {
          let tx = source.x+d*Math.cos(angle),
              ty = source.y+d*Math.sin(angle)
          if (this.isPointInPath(tx,ty)) return true
        }
      }
    }

    class Agent {
      constructor(i,j,f=0) {
        this.i = Number(i)
        this.j = Number(j)
        this.f = Number(f)
        this.w = this.width = mapDefs.width
        this.h = this.height = mapDefs.height
      }
      get x() {return (this.i-this.j%2/2)*this.width}
      get y() {return (this.j*3/4)*this.height}

      draw(ctx=CTX['agt']) {
        ctx.save()
        ctx.beginPath()
        ctx.translate(this.x,this.y)
        ctx.lineTo(-this.w/2,-this.h*3/4)
        ctx.lineTo(+this.w/2,-this.h*3/4)
        ctx.lineTo(+this.w/1,-this.h*0/4)
        ctx.lineTo(+this.w/2,+this.h*3/4)
        ctx.lineTo(-this.w/2,+this.h*3/4)
        ctx.lineTo(-this.w/1,+this.h*0/4)
        ctx.closePath()
        // ctx.clip()
        ctx.strokeStyle='#ff0'
        ctx.stroke()
        ctx.restore()
        this.aim(ctx)
      }
      aim(ctx) {
        if (!hoveredCell) return
        let dx = hoveredCell.x-this.x,
            dy = hoveredCell.y-this.y,
            angle = Math.atan2(dy,dx),
            distance=Math.hypot(dx,dy)
        let loop=0,loop2=0,blocked=false
        for (let dj=0;Math.abs(dj)<=Math.abs(hoveredCell.j-this.j);dj+=Math.sign(hoveredCell.j-this.j)||1) {
          let tj=this.j+dj
          for (let di=0;Math.abs(di)<=Math.abs(hoveredCell.i-this.i);di+=Math.sign(hoveredCell.i-this.i)||1) {
            let ti=this.i+di
            let testCell=bitMap[tj][ti]
            let inLine=testCell.intersects(this,angle,distance)
            blocked||=inLine&&testCell.k==0
            testCell.infill(
              inLine
                ?blocked
                  ?'#8888'
                  :'#f008'
                :bitMap[tj][ti].k==0
                  ?'#0f08'
                  :'#00f8'
            )
          }
        }
        ctx.save()
        ctx.beginPath()
        ctx.moveTo(this.x,this.y)
        ctx.lineTo(hoveredCell.x,hoveredCell.y)
        ctx.setLineDash([5])
        ctx.strokeStyle='white'
        ctx.stroke()
        ctx.restore()
      }
    }

    // addEventListener('contextmenu',e=>e.preventDefault())
    addEventListener('mousedown',e=>{
      if (e.button==0) {
        console.log('left')
        agents[0].i=hoveredCell.i
        agents[0].j=hoveredCell.j
      }
    })
  </script>
</body>
</html>
